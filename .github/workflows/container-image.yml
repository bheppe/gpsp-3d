name: Container Image

on:
  push:
    branches: [main]
    paths:
      - docker/gpsp3d-devcontainer.Dockerfile
      - .github/workflows/container-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Build Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tagged with a hash of the Dockerfile, the tag CI and releases pull
      # (docker/build-image.sh); "latest" is only for people
      - name: Image name
        run: |
          image="$(bash docker/build-image.sh)"
          echo "IMAGE_NAME=${image%:*}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${image##*:}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gpsp3d-devcontainer.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
